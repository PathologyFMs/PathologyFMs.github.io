    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <header>
        <div class="container" style="position: relative;">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                <i class="ph ph-sun" id="themeIcon"></i>
            </button>
            <h1 class="gradient-text">Pathology Foundation Models</h1>
            <p class="subtitle">A comprehensive summary of state-of-the-art models mapping the latent space of pathology.</p>
            
            <div class="header-actions" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem;">
                <button id="contributeBtn" class="action-btn action-btn-primary" title="How to add a paper"><i class="ph ph-git-pull-request"></i> Contribute</button>
                <a href="https://github.com/dibalokechanda/PFMs" class="action-btn" target="_blank"><i class="ph ph-github-logo"></i> GitHub</a>
                <button id="bibtexBtn" class="action-btn" title="Copy BibTeX citation for this site"><i class="ph ph-code"></i> BibTeX</button>
                <a href="mailto:dibaloke.chanda@marquette.edu" class="action-btn"><i class="ph ph-envelope-simple"></i> Contact</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-box">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search models, methods, or ideas..." aria-label="Search models, methods, or ideas">
            </div>
            <div class="filter-box">
                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="all">All Categories</option>
                    <!-- Options populated via JS -->
                </select>
            </div>
            <button id="facetBtn" class="facet-toggle" aria-expanded="false" title="Filter by metadata">
                <i class="ph ph-sliders-horizontal"></i> Filters<span id="facetCount" class="facet-count" hidden>0</span>
            </button>
            <div class="view-toggle">
                <button id="gridBtn" class="view-btn" aria-label="Grid View"><i class="ph ph-squares-four"></i></button>
                <button id="tableBtn" class="view-btn active" aria-label="Table View"><i class="ph ph-list-dashes"></i></button>
                <button id="timelineBtn" class="view-btn" aria-label="Spiral Timeline View"><i class="ph ph-clock-countdown"></i></button>
                <button id="swimlaneBtn" class="view-btn" aria-label="Swimlane Timeline View"><i class="ph ph-rows"></i></button>
                <button id="treeBtn" class="view-btn" aria-label="Tree View"><i class="ph ph-tree-structure"></i></button>
            </div>
        </div>

        <div id="facetPanel" class="facet-panel" hidden></div>

        <div id="modelsContainer" class="models-container">
            <!-- Categories and Cards rendered via JS -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p style="font-size: 0.95rem; color: var(--text-secondary);">
                Created and Maintained by<br>
                <strong style="color: var(--text-primary); font-size: 1.05rem;">Dibaloke Chanda</strong><br>
                PhD Student, Department of Computer Science, Marquette University
            </p>
        </div>
    </footer>

    <!-- Metadata Modal -->
    <div id="metadataModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h3 id="modalTitle">Model Name</h3>
                    <div id="modalSubtitle" class="modal-subtitle"></div>
                </div>
                <button class="close-modal" id="closeModal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Table injected here via JS -->
            </div>
        </div>
    </div>

    <!-- Data and Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
