name: Sync to PathologyFMs GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    # CRITICAL:
    # The workflow is mirrored into PathologyFMs.github.io.
    # Do not allow it to run there.
    if: github.repository == 'dibalokechanda/PFMs'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure organization Pages URLs
        run: |
          python3 <<'PY'
          from pathlib import Path

          old_url = "https://dibalokechanda.github.io/PFMs/"
          new_url = "https://PathologyFMs.github.io/"

          # index.html is required; the others carry the same canonical URL
          # and must be rewritten too, or the mirror advertises a sitemap and
          # canonical link pointing back at the source Pages site.
          targets = ["index.html", "sitemap.xml", "robots.txt"]

          if not Path("index.html").exists():
              raise SystemExit("index.html was not found")

          for name in targets:
              path = Path(name)

              if not path.exists():
                  print(f"{name}: not present, skipping.")
                  continue

              text = path.read_text()

              if old_url in text:
                  count = text.count(old_url)
                  path.write_text(text.replace(old_url, new_url))
                  print(f"{name}: replaced {count} occurrence(s) of {old_url}")
              else:
                  print(f"{name}: original GitHub Pages URL not found, left unchanged.")
          PY

      - name: Commit organization-specific URL changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "No organization-specific changes to commit."
          else
            git commit -m "Configure PathologyFMs GitHub Pages URL"
          fi

      - name: Verify sync token is available
        env:
          TOKEN: ${{ secrets.PAGES_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: PAGES_SYNC_TOKEN is empty or unavailable."
            echo "This workflow must run from dibalokechanda/PFMs."
            exit 1
          fi

          echo "PAGES_SYNC_TOKEN is available."
          echo "Token length: ${#TOKEN}"

      - name: Push to PathologyFMs Pages repository
        env:
          TOKEN: ${{ secrets.PAGES_SYNC_TOKEN }}
        run: |
          git remote remove pages 2>/dev/null || true

          git remote add pages \
            "https://x-access-token:${TOKEN}@github.com/PathologyFMs/PathologyFMs.github.io.git"

          git push pages HEAD:main --force
